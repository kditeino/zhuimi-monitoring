<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="refresh" content="600" />
  <title>追觅客户监控 · Susciyuan</title>
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("zhuimi-theme");
        if (saved === "light" || saved === "dark") {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          theme = "light";
        }
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0f;
      --bg-elev: #11141a;
      --bg-card: #161a22;
      --bg-row: #141821;
      --bg-hover: #1b2130;
      --bg-active: #1e2738;
      --line: #262b36;
      --line-strong: #343b4a;
      --text: #e8ebf0;
      --text-2: #b7bec9;
      --muted: #7d8594;
      --money: #c4b07a;
      --money-dim: rgba(196, 176, 122, .12);
      --error: #e25b6a;
      --error-dim: rgba(226, 91, 106, .12);
      --ok: #5dae86;
      --ok-dim: rgba(93, 174, 134, .12);
      --steel: #8ea0b8;
      --steel-dim: rgba(142, 160, 184, .14);
      --recharge: #8ea4d4;
      --manage: #b9a3c9;
      --system: #9aa3b2;
      --refund: #7db8c9;
      --shadow: 0 8px 24px rgba(0,0,0,.28);
      --radius: 12px;
      --pill-bd: rgba(142,160,184,.28);
      --row-active-bd: rgba(142,160,184,.55);
      --pre-bg: #0b0d12;
      --pre-fg: #d5dbe6;
      --banner-err-fg: #f3b4ba;
      --skel-1: #141821;
      --skel-2: #1c2230;
      --badge-recharge-fg: #8ea4d4;
      --badge-recharge-bd: rgba(142,164,212,.3);
      --badge-consume-fg: #86d0ac;
      --badge-consume-bd: rgba(93,174,134,.3);
      --badge-manage-bg: rgba(185,163,201,.12);
      --badge-manage-fg: #d2c0de;
      --badge-manage-bd: rgba(185,163,201,.3);
      --badge-system-bg: rgba(154,163,178,.12);
      --badge-system-fg: #c5ccd6;
      --badge-system-bd: rgba(154,163,178,.28);
      --badge-error-fg: #f0a0a8;
      --badge-error-bd: rgba(226,91,106,.35);
      --badge-refund-bg: rgba(125,184,201,.12);
      --badge-refund-fg: #9ed0dc;
      --badge-refund-bd: rgba(125,184,201,.3);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f5f8;
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --bg-row: #ffffff;
      --bg-hover: #eef2f7;
      --bg-active: #e6edf6;
      --line: #d7dde7;
      --line-strong: #c2cad6;
      --text: #1a2030;
      --text-2: #3d4656;
      --muted: #667085;
      --money: #8f7234;
      --money-dim: rgba(143, 114, 52, .10);
      --error: #c43d4d;
      --error-dim: rgba(196, 61, 77, .10);
      --ok: #2f8a5c;
      --ok-dim: rgba(47, 138, 92, .10);
      --steel: #4f6480;
      --steel-dim: rgba(79, 100, 128, .12);
      --recharge: #3d5a94;
      --manage: #6a4d7d;
      --system: #4a5260;
      --refund: #2d6473;
      --shadow: 0 8px 24px rgba(24, 36, 56, .08);
      --pill-bd: rgba(79,100,128,.28);
      --row-active-bd: rgba(79,100,128,.42);
      --pre-bg: #eef1f6;
      --pre-fg: #1f2533;
      --banner-err-fg: #9a2433;
      --skel-1: #e6ebf2;
      --skel-2: #f4f6f9;
      --badge-recharge-fg: #3d5a94;
      --badge-recharge-bd: rgba(61,90,148,.28);
      --badge-consume-fg: #2a7a54;
      --badge-consume-bd: rgba(42,122,84,.28);
      --badge-manage-bg: rgba(122,95,143,.10);
      --badge-manage-fg: #6a4d7d;
      --badge-manage-bd: rgba(122,95,143,.28);
      --badge-system-bg: rgba(92,101,115,.10);
      --badge-system-fg: #4a5260;
      --badge-system-bd: rgba(92,101,115,.25);
      --badge-error-fg: #b02e3d;
      --badge-error-bd: rgba(196,61,77,.30);
      --badge-refund-bg: rgba(61,122,138,.10);
      --badge-refund-fg: #2d6473;
      --badge-refund-bd: rgba(61,122,138,.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100vh; }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 36px;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
    }
    header.top {
      position: sticky; top: 0; z-index: 8;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(12px);
      margin: -16px -14px 16px;
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    header.top h1 {
      margin: 0;
      font-size: 1.28rem;
      font-weight: 650;
      letter-spacing: .01em;
    }
    .theme-toggle {
      display: inline-flex;
      flex-shrink: 0;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
      border-radius: 9px;
      overflow: hidden;
    }
    .theme-toggle button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 11px;
      min-height: 34px;
      min-width: 44px;
      font-size: 12px;
      font-weight: 620;
      cursor: pointer;
      font-family: inherit;
    }
    .theme-toggle button + button { border-left: 1px solid var(--line); }
    .theme-toggle button[aria-pressed="true"] {
      background: var(--bg-active);
      color: var(--text);
    }
    .theme-toggle button:focus-visible {
      outline: 2px solid var(--steel);
      outline-offset: -2px;
    }
    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
    }
    .pill {
      display: inline-flex; align-items: center;
      background: var(--steel-dim);
      color: var(--steel);
      border: 1px solid var(--pill-bd);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: var(--bg-card);
      color: var(--text);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 550;
    }
    .btn:hover { border-color: var(--steel); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .55; cursor: default; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (min-width: 560px) {
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 12px 11px;
      min-height: 86px;
    }
    .card .label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .card .value {
      font-size: 1.28rem;
      font-weight: 680;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .card .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }
    .card.money .value { color: var(--money); }
    .card.error .value { color: var(--error); }
    .card.warn .value { color: var(--error); }
    .card.warn { border-color: var(--badge-error-bd); }
    .chips, .models {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin: 0 0 14px;
    }
    .chip {
      font-size: 11px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--text-2);
    }
    .chip b { font-weight: 650; color: var(--text); }
    .chip.bad b { color: var(--error); }
    .section-title {
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 4px 2px 8px;
      font-weight: 620;
      font-size: 13px;
    }
    .section-title span { color: var(--muted); font-size: 12px; font-weight: 400; }
    .logs {
      display: flex; flex-direction: column; gap: 7px;
      max-height: 52vh; overflow: auto;
      padding-right: 2px;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .row {
      background: var(--bg-row);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 11px;
      cursor: pointer;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .row:hover { background: var(--bg-hover); border-color: var(--line-strong); }
    .row.active {
      background: var(--bg-active);
      border-color: var(--row-active-bd);
      box-shadow: inset 3px 0 0 var(--steel);
    }
    .row-top {
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      margin-bottom: 6px;
    }
    .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .badge {
      font-size: 11px; font-weight: 650;
      border-radius: 999px; padding: 2px 8px;
      border: 1px solid transparent;
    }
    .t-充值 { background: var(--steel-dim); color: var(--badge-recharge-fg); border-color: var(--badge-recharge-bd); }
    .t-消费 { background: var(--ok-dim); color: var(--badge-consume-fg); border-color: var(--badge-consume-bd); }
    .t-管理 { background: var(--badge-manage-bg); color: var(--badge-manage-fg); border-color: var(--badge-manage-bd); }
    .t-系统 { background: var(--badge-system-bg); color: var(--badge-system-fg); border-color: var(--badge-system-bd); }
    .t-错误 { background: var(--error-dim); color: var(--badge-error-fg); border-color: var(--badge-error-bd); }
    .t-退款 { background: var(--badge-refund-bg); color: var(--badge-refund-fg); border-color: var(--badge-refund-bd); }
    .meta {
      display: flex; flex-wrap: wrap; gap: 6px 10px;
      font-size: 13px; color: var(--text);
    }
    .meta b { font-weight: 620; }
    .meta .muted { color: var(--muted); }
    .meta .yen { color: var(--money); font-variant-numeric: tabular-nums; }
    .content-line {
      margin-top: 6px; color: var(--muted); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .detail {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      min-height: 148px;
      box-shadow: var(--shadow);
    }
    .detail h3 { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
    .detail .empty, .logs .empty { color: var(--muted); font-size: 13px; }
    .kv {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 7px 10px;
      font-size: 13px;
    }
    @media (min-width: 560px) {
      .kv { grid-template-columns: 84px 1fr 84px 1fr; }
    }
    .kv .k { color: var(--muted); }
    .kv .v { word-break: break-all; font-variant-numeric: tabular-nums; }
    .kv .v.bad { color: var(--error); }
    .kv .v.money { color: var(--money); }
    pre.full {
      margin: 12px 0 0;
      padding: 10px 12px;
      background: var(--pre-bg);
      border-radius: 10px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      color: var(--pre-fg);
      max-height: 240px;
      overflow: auto;
    }
    .banner {
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .banner.err {
      background: var(--error-dim);
      color: var(--banner-err-fg);
      border: 1px solid var(--badge-error-bd);
    }
    .banner.empty {
      background: var(--bg-card);
      color: var(--muted);
      border: 1px dashed var(--line-strong);
    }
    .loading {
      color: var(--muted);
      padding: 28px 8px;
      text-align: center;
    }
    .skel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .skel i {
      display: block; height: 78px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--skel-1), var(--skel-2), var(--skel-1));
      background-size: 200% 100%;
      animation: shine 1.2s ease-in-out infinite;
    }
    @keyframes shine {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="header-row">
        <div>
          <div class="eyebrow">Susciyuan · Internal</div>
          <h1>追觅客户监控</h1>
        </div>
        <div class="theme-toggle" role="group" aria-label="主题">
          <button type="button" id="themeLight" aria-pressed="false">浅色</button>
          <button type="button" id="themeDark" aria-pressed="true">深色</button>
        </div>
      </div>
      <div class="sub">
        <span class="pill" id="scopePill">全站</span>
        <span id="windowText">近 3 天</span>
        <span id="genText"></span>
        <button class="btn" id="refreshBtn" type="button">立即刷新</button>
        <a class="btn" id="logoutLink" href="/api/logout">退出</a>
      </div>
    </header>

    <div id="errorBox" class="banner err hidden"></div>
    <div id="loading" class="loading">
      正在拉取近 3 天日志
      <div class="skel"><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="app" class="hidden">
      <div class="metrics" id="metrics"></div>
      <div class="chips" id="typeChips"></div>
      <div class="models" id="modelChips"></div>

      <div class="section-title">
        日志列表
        <span id="logMeta"></span>
      </div>
      <div class="logs" id="logs"></div>

      <div class="section-title">详情 <span>点击日志行查看完整内容</span></div>
      <div class="detail" id="detail">
        <div class="empty">尚未选择日志。点击上方列表中的一行，查看 Request ID、状态码与原文。</div>
      </div>
    </div>
  </div>

  <script>
    const TYPE_CLASS = {
      "充值": "t-充值", "消费": "t-消费", "管理": "t-管理",
      "系统": "t-系统", "错误": "t-错误", "退款": "t-退款"
    };
    const THEME_KEY = "zhuimi-theme";

    function resolveTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "light" || saved === "dark") return saved;
      } catch (e) {}
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
        return "light";
      }
      return "dark";
    }

    function applyTheme(theme) {
      const t = theme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      const lightBtn = document.getElementById("themeLight");
      const darkBtn = document.getElementById("themeDark");
      if (lightBtn) lightBtn.setAttribute("aria-pressed", t === "light" ? "true" : "false");
      if (darkBtn) darkBtn.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
    }

    function setTheme(theme) {
      applyTheme(theme);
      try { localStorage.setItem(THEME_KEY, theme === "light" ? "light" : "dark"); } catch (e) {}
    }

    applyTheme(resolveTheme());
    document.getElementById("themeLight").addEventListener("click", function () { setTheme("light"); });
    document.getElementById("themeDark").addEventListener("click", function () { setTheme("dark"); });

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        if (c === "&") return "&amp;";
        if (c === "<") return "&lt;";
        if (c === ">") return "&gt;";
        if (c === '"') return "&quot;";
        return "&#39;";
      });
    }

    function money(n) {
      return "¥" + Number(n || 0).toFixed(2);
    }

    const WALLET_HIST_KEY = "zhuimi-wallet-history";
    const WALLET_COOKIE = "zm_wh";
    const MIN_SPAN_HOURS = 2;
    const HISTORY_KEEP_SECS = 3 * 86400;
    const MAX_HISTORY = 200;
    const SEED_MAX_AGE = 36 * 3600;
    const WALLET_SEED = [
      {ts:1787056427,aipdd:127.4249,seedance:798.96},
      {ts:1787058075,aipdd:125.8959,seedance:797.3},
      {ts:1787060117,aipdd:125.1559,seedance:790.97},
      {ts:1787061782,aipdd:122.1959,seedance:783.98},
      {ts:1787067231,aipdd:122.1959,seedance:781.66}
    ];

    function parseHistNum(raw) {
      if (raw == null) return null;
      const s = String(raw).trim();
      if (!s) return null;
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function decodeWalletHistory(raw) {
      let text = String(raw || "").trim();
      if (!text) return [];
      try { text = decodeURIComponent(text); } catch (e) {}
      if (text.startsWith("v1.")) text = text.slice(3);
      const out = [];
      text.split(";").forEach(function (piece) {
        piece = piece.trim();
        if (!piece) return;
        const bits = piece.split(",");
        const ts = Number(bits[0]);
        if (!Number.isFinite(ts)) return;
        out.push({ ts: ts, aipdd: parseHistNum(bits[1]), seedance: parseHistNum(bits[2]) });
      });
      return out;
    }

    function encodeWalletHistory(hist) {
      return "v1." + (hist || []).map(function (h) {
        const a = h.aipdd == null || !Number.isFinite(Number(h.aipdd)) ? "" : String(h.aipdd);
        const s = h.seedance == null || !Number.isFinite(Number(h.seedance)) ? "" : String(h.seedance);
        return String(h.ts) + "," + a + "," + s;
      }).join(";");
    }

    function mergeWalletHistoryLists() {
      const now = Date.now() / 1000;
      const byTs = {};
      function add(list) {
        (list || []).forEach(function (h) {
          if (!h) return;
          const ts = Number(h.ts);
          if (!Number.isFinite(ts)) return;
          const prev = byTs[ts] || { ts: ts, aipdd: null, seedance: null };
          byTs[ts] = {
            ts: ts,
            aipdd: h.aipdd != null && Number.isFinite(Number(h.aipdd)) ? Number(h.aipdd) : prev.aipdd,
            seedance: h.seedance != null && Number.isFinite(Number(h.seedance)) ? Number(h.seedance) : prev.seedance
          };
        });
      }
      let stored = [];
      try {
        stored = JSON.parse(localStorage.getItem(WALLET_HIST_KEY) || "[]");
        if (!Array.isArray(stored)) stored = [];
      } catch (e) { stored = []; }
      let cookiePts = [];
      try {
        const m = document.cookie.match(/(?:^|;\s*)zm_wh=([^;]*)/);
        if (m) cookiePts = decodeWalletHistory(m[1]);
      } catch (e) {}
      const seed = WALLET_SEED.filter(function (h) { return now - h.ts <= SEED_MAX_AGE; });
      add(stored);
      add(cookiePts);
      add(seed);
      const cutoff = now - HISTORY_KEEP_SECS;
      let hist = Object.keys(byTs).map(function (k) { return byTs[k]; })
        .filter(function (h) { return h.ts >= cutoff && h.ts <= now + 120; })
        .sort(function (a, b) { return a.ts - b.ts; });
      if (hist.length > MAX_HISTORY) hist = hist.slice(-MAX_HISTORY);
      return hist;
    }

    function saveWalletHistory(hist) {
      try { localStorage.setItem(WALLET_HIST_KEY, JSON.stringify(hist)); } catch (e) {}
      try {
        const compact = encodeWalletHistory(hist);
        const secure = location.protocol === "https:" ? "; Secure" : "";
        document.cookie = WALLET_COOKIE + "=" + encodeURIComponent(compact) +
          "; Path=/; Max-Age=" + (3 * 86400) + "; SameSite=Lax" + secure;
      } catch (e) {}
    }

    function appendWalletSnapshot(hist, nowSec, aipddCny, seedCny) {
      const list = (hist || []).slice();
      const last = list.length ? list[list.length - 1] : null;
      if (last && Math.abs(Number(last.ts) - nowSec) < 1) {
        last.aipdd = aipddCny != null ? aipddCny : last.aipdd;
        last.seedance = seedCny != null ? seedCny : last.seedance;
        return list;
      }
      list.push({ ts: nowSec, aipdd: aipddCny, seedance: seedCny });
      const cutoff = nowSec - HISTORY_KEEP_SECS;
      let out = list.filter(function (h) { return Number(h.ts) >= cutoff; });
      if (out.length > MAX_HISTORY) out = out.slice(-MAX_HISTORY);
      return out;
    }

    function estimateRunway(hist, key, nowCny, now) {
      const empty = { burn_24h: null, days_left: null, sample_hours: 0, reliable: false };
      if (nowCny == null || !Number.isFinite(Number(nowCny))) return empty;
      const nowN = Number(nowCny);
      const points = (hist || []).filter(function (h) {
        return h && h[key] != null && Number(h.ts || 0) < now;
      });
      if (!points.length) return empty;
      const target = now - 86400;
      const windowed = points.filter(function (h) {
        const age = now - Number(h.ts);
        return age >= 18 * 3600 && age <= 36 * 3600;
      });
      let old;
      if (windowed.length) {
        old = windowed[0];
        let best = Math.abs(Number(old.ts) - target);
        windowed.forEach(function (h) {
          const d = Math.abs(Number(h.ts) - target);
          if (d < best) { best = d; old = h; }
        });
      } else {
        old = points[0];
      }
      const spanH = (now - Number(old.ts)) / 3600;
      if (spanH < MIN_SPAN_HOURS) {
        return { burn_24h: null, days_left: null, sample_hours: Math.round(spanH * 100) / 100, reliable: false };
      }
      const burned = Number(old[key]) - nowN;
      if (burned <= 0.05) {
        return { burn_24h: 0, days_left: null, sample_hours: Math.round(spanH * 100) / 100, reliable: spanH >= 12 };
      }
      const burn24h = burned / spanH * 24;
      const days = burn24h > 0 ? nowN / burn24h : null;
      return {
        burn_24h: Math.round(burn24h * 10000) / 10000,
        days_left: days != null ? Math.round(days * 100) / 100 : null,
        sample_hours: Math.round(spanH * 100) / 100,
        reliable: spanH >= 6
      };
    }

    function hydrateWalletHistory() {
      const hist = mergeWalletHistoryLists();
      saveWalletHistory(hist);
      return hist;
    }

    function finiteCny(row) {
      if (!row || row.cny == null) return null;
      const n = Number(row.cny);
      return Number.isFinite(n) ? n : null;
    }

    function attachClientRunway(balances) {
      const now = Date.now() / 1000;
      let hist = hydrateWalletHistory();
      const a = Object.assign({}, (balances && balances.aipdd) || {});
      const v = Object.assign({}, (balances && balances.volces) || {});
      const aCny = finiteCny(a);
      const sCny = finiteCny(v);
      hist = appendWalletSnapshot(hist, now, aCny, sCny);
      saveWalletHistory(hist);
      function apply(row, key, cny) {
        if (row.days_left != null || row.burn_24h != null) return row;
        const run = estimateRunway(hist, key, cny, now);
        row.days_left = run.days_left;
        row.burn_24h = run.burn_24h;
        row.sample_hours = run.sample_hours;
        row.days_reliable = run.reliable;
        return row;
      }
      return { aipdd: apply(a, "aipdd", aCny), volces: apply(v, "seedance", sCny) };
    }

    function fmtDays(n) {
      return (Math.round(Number(n) * 10) / 10).toFixed(1);
    }

    function fmtBurn(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return "¥0";
      if (x >= 10) return "¥" + String(Math.round(x));
      return "¥" + x.toFixed(1);
    }

    function fmtHours(n) {
      const x = Number(n) || 0;
      if (x >= 10) return String(Math.round(x));
      return (Math.round(x * 10) / 10).toString();
    }

    function runwayHint(row) {
      const days = row.days_left;
      const burn = row.burn_24h;
      const hours = Number(row.sample_hours || 0);
      const reliable = !!row.days_reliable;
      if (burn != null && Number.isFinite(Number(burn)) && Number(burn) <= 0.05) {
        return "用量很低，暂不估天数";
      }
      if (days != null && Number.isFinite(Number(days)) && burn != null && Number(burn) > 0.05) {
        let s = "还能撑约 " + fmtDays(days) + " 天 · 近24小时消耗 " + fmtBurn(burn);
        if (!reliable) s += "（采样中）";
        return s;
      }
      if (hours > 0) {
        return "采样中（已采 " + fmtHours(hours) + " 小时）";
      }
      return null;
    }

    function balanceCard(label, item, missingHint) {
      const row = item || {};
      if (!row.configured) {
        return { label: label, value: "待配置", hint: row.error || missingHint, cls: "money" };
      }
      if (row.error || row.cny == null || !Number.isFinite(Number(row.cny))) {
        return { label: label, value: "—", hint: row.error || "查询失败", cls: "money" };
      }
      const run = runwayHint(row);
      let hint = run;
      if (!hint) {
        if (label.indexOf("火山") >= 0) {
          hint = "账户可用余额（人民币）";
        } else if (row.awcoin != null) {
          hint = String(row.awcoin) + " AWCoin";
        } else {
          hint = "官方 AIPDD 钱包";
        }
      }
      let cls = "money";
      if (row.days_left != null && Number(row.days_left) <= 2) cls += " warn";
      return { label: label, value: money(row.cny), hint: hint, cls: cls };
    }

    function renderMetrics(m, balances) {
      const errN = Number(m.error_count || 0);
      const bal = attachClientRunway(balances || {});
      const cards = [
        { label: "用量金额", value: money(m.usage_cny), hint: "配额 " + Math.round(m.usage_quota||0) + " · ≈$" + Number(m.usage_usd||0).toFixed(4), cls: "money" },
        balanceCard("AIPDD剩余金额", bal.aipdd, "尚未配置 AIPDD_API_KEY"),
        balanceCard("火山引擎剩余金额", bal.volces, "尚未配置 VOLC_ACCESS_KEY_ID"),
        { label: "任务 / 请求", value: String(m.total_requests ?? 0), hint: "消费 " + (m.consume_count||0) + " 条", cls: "" },
        { label: "错误总数", value: String(errN), hint: "type = 错误", cls: "error" },
        { label: "最多任务用户", value: m.top_task_user || "—", hint: (m.top_task_count||0) + " 次消费", cls: "" },
        { label: "最多错误用户", value: m.top_error_user || "—", hint: (m.top_error_count||0) + " 次错误", cls: errN ? "error" : "" },
      ];
      document.getElementById("metrics").innerHTML = cards.map(c =>
        '<div class="card ' + c.cls + '">' +
          '<div class="label">' + esc(c.label) + '</div>' +
          '<div class="value">' + esc(c.value) + '</div>' +
          '<div class="hint">' + esc(c.hint) + '</div>' +
        '</div>'
      ).join("");
    }

    function renderChips(typeCounts, models) {
      const typeBox = document.getElementById("typeChips");
      const modelBox = document.getElementById("modelChips");
      const entries = Object.entries(typeCounts || {});
      typeBox.innerHTML = entries.length
        ? entries.map(([k, v]) => {
            const bad = k === "错误" ? " bad" : "";
            return '<span class="chip' + bad + '">' + esc(k) + ' <b>' + esc(v) + '</b></span>';
          }).join("")
        : "";
      const top = (models || []).slice(0, 6);
      modelBox.innerHTML = top.length
        ? top.map(m => '<span class="chip">' + esc(m.model) + ' <b>' + esc(m.count) + '</b></span>').join("")
        : "";
    }

    let currentLogs = [];

    function renderLogs(logs) {
      currentLogs = logs || [];
      const box = document.getElementById("logs");
      if (!currentLogs.length) {
        box.innerHTML = '<div class="banner empty">窗口内暂无日志</div>';
        return;
      }
      box.innerHTML = currentLogs.map((l, idx) => {
        const badgeCls = TYPE_CLASS[l.type_label] || "t-系统";
        const showCost = l.type === 2 || (l.cost_cny && l.cost_cny > 0);
        const cost = showCost
          ? '<span class="muted">费用</span> <b class="yen">' + esc(money(l.cost_cny)) + '</b>'
          : '<span class="muted">费用</span> —';
        return (
          '<div class="row" data-idx="' + idx + '" role="button" tabindex="0">' +
            '<div class="row-top">' +
              '<span class="time">' + esc(l.time) + '</span>' +
              '<span class="badge ' + badgeCls + '">' + esc(l.type_label) + '</span>' +
            '</div>' +
            '<div class="meta">' +
              '<span><span class="muted">用户</span> <b>' + esc(l.username || "—") + '</b></span>' +
              '<span><span class="muted">模型</span> ' + esc(l.model || "—") + '</span>' +
              '<span><span class="muted">耗时</span> ' + esc(l.duration || 0) + 's</span>' +
              '<span>' + cost + '</span>' +
            '</div>' +
            '<div class="content-line">' + esc(l.content_short || "") + '</div>' +
          '</div>'
        );
      }).join("");

      box.querySelectorAll(".row").forEach(el => {
        el.addEventListener("click", () => selectLog(Number(el.dataset.idx)));
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectLog(Number(el.dataset.idx)); }
        });
      });
    }

    function kv(k, v, cls) {
      return '<div class="k">' + esc(k) + '</div><div class="v' + (cls ? ' ' + cls : '') + '">' + v + '</div>';
    }

    function selectLog(idx, opts) {
      const l = currentLogs[idx];
      if (!l) return;
      document.querySelectorAll(".row").forEach((el, i) => el.classList.toggle("active", i === idx));
      const detail = document.getElementById("detail");
      const otherStr = l.other && Object.keys(l.other).length ? JSON.stringify(l.other, null, 2) : "";
      const statusCls = (l.status_code && Number(l.status_code) >= 400) ? "bad" : "";
      detail.innerHTML =
        '<h3>' + esc(l.type_label) + ' · ' + esc(l.username || "—") + ' · ' + esc(l.time_full || l.time) + '</h3>' +
        '<div class="kv">' +
          kv("Request ID", esc(l.request_id || "—")) +
          kv("状态码", esc(l.status_code ?? "—"), statusCls) +
          kv("模型", esc(l.model || "—")) +
          kv("分组", esc(l.group || "—")) +
          kv("令牌", esc(l.token_name || "—")) +
          kv("渠道", esc(l.channel_name || "—")) +
          kv("耗时", esc(l.duration || 0) + " 秒") +
          kv("费用", esc(money(l.cost_cny)) + "（quota " + esc(l.quota) + " / ≈$" + esc(Number(l.cost_usd||0).toFixed(6)) + "）", "money") +
          kv("Tokens", "prompt " + esc(l.prompt_tokens) + " · completion " + esc(l.completion_tokens)) +
          kv("IP", esc(l.ip || "—")) +
          kv("日志 ID", esc(l.id)) +
        '</div>' +
        '<pre class="full">' + esc(l.content || "(无内容)") + '</pre>' +
        (otherStr ? '<pre class="full">' + esc(otherStr) + '</pre>' : '');
      if (!opts || opts.scrollDetail !== false) {
        detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function revealLatestLog() {
      if (!currentLogs.length) return;
      selectLog(0, { scrollDetail: false });
      const box = document.getElementById("logs");
      if (!box) return;
      box.scrollTop = 0;
      const row = box.querySelector(".row");
      if (!row) return;
      const rowRect = row.getBoundingClientRect();
      const header = document.querySelector("header.top");
      const headerH = header ? header.getBoundingClientRect().height : 0;
      if (rowRect.top < headerH + 4 || rowRect.bottom > window.innerHeight) {
        const top = window.scrollY + rowRect.top - headerH - 8;
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      }
    }

    async function load(refresh) {
      const errBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const app = document.getElementById("app");
      const btn = document.getElementById("refreshBtn");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "刷新中";
      if (app.classList.contains("hidden")) loading.classList.remove("hidden");
      try {
        hydrateWalletHistory();
        const q = refresh ? "?refresh=1" : "";
        const [ovSettled, balSettled] = await Promise.allSettled([
          fetch("/api/overview" + q, { cache: "no-store", credentials: "same-origin" }).then((res) => {
            if (res.status === 401) { location.replace("/"); throw new Error("unauthorized"); }
            return res.json();
          }),
          fetch("/api/balances" + q, { cache: "no-store", credentials: "same-origin" }).then((res) => {
            if (res.status === 401) { location.replace("/"); throw new Error("unauthorized"); }
            return res.json();
          }),
        ]);
        if (ovSettled.status !== "fulfilled") throw ovSettled.reason || new Error("加载失败");
        const data = ovSettled.value;
        if (data && data.error === "unauthorized") { location.replace("/"); return; }
        if (!data.ok) throw new Error(data.error || "加载失败");
        let balances = { aipdd: { configured: false }, volces: { configured: false } };
        if (balSettled.status === "fulfilled" && balSettled.value && balSettled.value.ok) {
          balances = balSettled.value;
        } else if (balSettled.status === "fulfilled" && balSettled.value && !balSettled.value.ok) {
          balances = {
            aipdd: { configured: true, error: "查询失败" },
            volces: { configured: true, error: "查询失败" },
          };
        }
        loading.classList.add("hidden");
        app.classList.remove("hidden");
        document.title = data.title || "追觅客户监控 · Susciyuan";
        document.getElementById("scopePill").textContent = data.filter && data.filter.site_wide ? "全站 · 近3天" : "过滤模式";
        document.getElementById("windowText").textContent =
          (data.window && data.window.start || "") + " ~ " + (data.window && data.window.end || "") +
          " (" + ((data.window && data.window.tz) || "CST") + ")";
        document.getElementById("genText").textContent =
          "更新 " + (data.generated_at || "") + (data.cached ? " · 缓存" : "");
        document.getElementById("logMeta").textContent =
          "展示 " + data.log_returned + "/" + data.log_total_in_window + "（上限 300）";
        renderMetrics(data.metrics || {}, balances);
        renderChips(data.type_counts || {}, data.top_models || []);
        renderLogs(data.logs || []);
        revealLatestLog();
      } catch (e) {
        loading.classList.add("hidden");
        errBox.classList.remove("hidden");
        errBox.textContent = "加载失败：" + (e.message || e);
      } finally {
        btn.disabled = false;
        btn.textContent = "立即刷新";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => load(true));
    document.getElementById("logoutLink").addEventListener("click", (e) => {
      e.preventDefault();
      fetch("/api/logout", { method: "POST", credentials: "same-origin" })
        .catch(() => {})
        .finally(() => location.replace("/"));
    });
    setInterval(() => load(true), 600000);
    load(false);
  </script>
</body>
