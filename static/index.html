<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="refresh" content="600" />
  <title>追觅客户监控 · Susciyuan</title>
  <style>
    :root {
      --bg: #090b0f;
      --bg-elev: #11141a;
      --bg-card: #161a22;
      --bg-row: #141821;
      --bg-hover: #1b2130;
      --bg-active: #1e2738;
      --line: #262b36;
      --line-strong: #343b4a;
      --text: #e8ebf0;
      --text-2: #b7bec9;
      --muted: #7d8594;
      --money: #c4b07a;
      --money-dim: rgba(196, 176, 122, .12);
      --error: #e25b6a;
      --error-dim: rgba(226, 91, 106, .12);
      --ok: #5dae86;
      --ok-dim: rgba(93, 174, 134, .12);
      --steel: #8ea0b8;
      --steel-dim: rgba(142, 160, 184, .14);
      --recharge: #8ea4d4;
      --manage: #b9a3c9;
      --system: #9aa3b2;
      --refund: #7db8c9;
      --shadow: 0 8px 24px rgba(0,0,0,.28);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100vh; }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 36px;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
    }
    header.top {
      position: sticky; top: 0; z-index: 8;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(12px);
      margin: -16px -14px 16px;
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    header.top h1 {
      margin: 0;
      font-size: 1.28rem;
      font-weight: 650;
      letter-spacing: .01em;
    }
    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
    }
    .pill {
      display: inline-flex; align-items: center;
      background: var(--steel-dim);
      color: var(--steel);
      border: 1px solid rgba(142,160,184,.28);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: var(--bg-card);
      color: var(--text);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 550;
    }
    .btn:hover { border-color: var(--steel); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .55; cursor: default; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (min-width: 560px) {
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 12px 11px;
      min-height: 86px;
    }
    .card .label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .card .value {
      font-size: 1.28rem;
      font-weight: 680;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .card .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }
    .card.money .value { color: var(--money); }
    .card.error .value { color: var(--error); }
    .chips, .models {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin: 0 0 14px;
    }
    .chip {
      font-size: 11px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--text-2);
    }
    .chip b { font-weight: 650; color: var(--text); }
    .chip.bad b { color: var(--error); }
    .section-title {
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 4px 2px 8px;
      font-weight: 620;
      font-size: 13px;
    }
    .section-title span { color: var(--muted); font-size: 12px; font-weight: 400; }
    .logs {
      display: flex; flex-direction: column; gap: 7px;
      max-height: 52vh; overflow: auto;
      padding-right: 2px;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .row {
      background: var(--bg-row);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 11px;
      cursor: pointer;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .row:hover { background: var(--bg-hover); border-color: var(--line-strong); }
    .row.active {
      background: var(--bg-active);
      border-color: rgba(142,160,184,.55);
      box-shadow: inset 3px 0 0 var(--steel);
    }
    .row-top {
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      margin-bottom: 6px;
    }
    .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .badge {
      font-size: 11px; font-weight: 650;
      border-radius: 999px; padding: 2px 8px;
      border: 1px solid transparent;
    }
    .t-充值 { background: var(--steel-dim); color: var(--recharge); border-color: rgba(142,164,212,.3); }
    .t-消费 { background: var(--ok-dim); color: #86d0ac; border-color: rgba(93,174,134,.3); }
    .t-管理 { background: rgba(185,163,201,.12); color: #d2c0de; border-color: rgba(185,163,201,.3); }
    .t-系统 { background: rgba(154,163,178,.12); color: #c5ccd6; border-color: rgba(154,163,178,.28); }
    .t-错误 { background: var(--error-dim); color: #f0a0a8; border-color: rgba(226,91,106,.35); }
    .t-退款 { background: rgba(125,184,201,.12); color: #9ed0dc; border-color: rgba(125,184,201,.3); }
    .meta {
      display: flex; flex-wrap: wrap; gap: 6px 10px;
      font-size: 13px; color: var(--text);
    }
    .meta b { font-weight: 620; }
    .meta .muted { color: var(--muted); }
    .meta .yen { color: var(--money); font-variant-numeric: tabular-nums; }
    .content-line {
      margin-top: 6px; color: var(--muted); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .detail {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      min-height: 148px;
      box-shadow: var(--shadow);
    }
    .detail h3 { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
    .detail .empty, .logs .empty { color: var(--muted); font-size: 13px; }
    .kv {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 7px 10px;
      font-size: 13px;
    }
    @media (min-width: 560px) {
      .kv { grid-template-columns: 84px 1fr 84px 1fr; }
    }
    .kv .k { color: var(--muted); }
    .kv .v { word-break: break-all; font-variant-numeric: tabular-nums; }
    .kv .v.bad { color: var(--error); }
    .kv .v.money { color: var(--money); }
    pre.full {
      margin: 12px 0 0;
      padding: 10px 12px;
      background: #0b0d12;
      border-radius: 10px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      color: #d5dbe6;
      max-height: 240px;
      overflow: auto;
    }
    .banner {
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .banner.err {
      background: var(--error-dim);
      color: #f3b4ba;
      border: 1px solid rgba(226,91,106,.35);
    }
    .banner.empty {
      background: var(--bg-card);
      color: var(--muted);
      border: 1px dashed var(--line-strong);
    }
    .loading {
      color: var(--muted);
      padding: 28px 8px;
      text-align: center;
    }
    .skel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .skel i {
      display: block; height: 78px;
      border-radius: 12px;
      background: linear-gradient(90deg, #141821, #1c2230, #141821);
      background-size: 200% 100%;
      animation: shine 1.2s ease-in-out infinite;
    }
    @keyframes shine {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="eyebrow">Susciyuan · Internal</div>
      <h1>追觅客户监控</h1>
      <div class="sub">
        <span class="pill" id="scopePill">全站</span>
        <span id="windowText">近 3 天</span>
        <span id="genText"></span>
        <button class="btn" id="refreshBtn" type="button">立即刷新</button>
      </div>
    </header>

    <div id="errorBox" class="banner err hidden"></div>
    <div id="loading" class="loading">
      正在拉取近 3 天日志
      <div class="skel"><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="app" class="hidden">
      <div class="metrics" id="metrics"></div>
      <div class="chips" id="typeChips"></div>
      <div class="models" id="modelChips"></div>

      <div class="section-title">
        日志列表
        <span id="logMeta"></span>
      </div>
      <div class="logs" id="logs"></div>

      <div class="section-title">详情 <span>点击日志行查看完整内容</span></div>
      <div class="detail" id="detail">
        <div class="empty">尚未选择日志。点击上方列表中的一行，查看 Request ID、状态码与原文。</div>
      </div>
    </div>
  </div>

  <script>
    const TYPE_CLASS = {
      "充值": "t-充值", "消费": "t-消费", "管理": "t-管理",
      "系统": "t-系统", "错误": "t-错误", "退款": "t-退款"
    };

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        if (c === "&") return "&amp;";
        if (c === "<") return "&lt;";
        if (c === ">") return "&gt;";
        if (c === '"') return "&quot;";
        return "&#39;";
      });
    }

    function money(n) {
      return "¥" + Number(n || 0).toFixed(2);
    }

    function renderMetrics(m) {
      const errN = Number(m.error_count || 0);
      const cards = [
        { label: "用量金额", value: money(m.usage_cny), hint: "配额 " + Math.round(m.usage_quota||0) + " · ≈$" + Number(m.usage_usd||0).toFixed(4), cls: "money" },
        { label: "任务 / 请求", value: String(m.total_requests ?? 0), hint: "消费 " + (m.consume_count||0) + " 条", cls: "" },
        { label: "错误总数", value: String(errN), hint: "type = 错误", cls: "error" },
        { label: "最多任务用户", value: m.top_task_user || "—", hint: (m.top_task_count||0) + " 次消费", cls: "" },
        { label: "最多错误用户", value: m.top_error_user || "—", hint: (m.top_error_count||0) + " 次错误", cls: errN ? "error" : "" },
      ];
      document.getElementById("metrics").innerHTML = cards.map(c =>
        '<div class="card ' + c.cls + '">' +
          '<div class="label">' + esc(c.label) + '</div>' +
          '<div class="value">' + esc(c.value) + '</div>' +
          '<div class="hint">' + esc(c.hint) + '</div>' +
        '</div>'
      ).join("");
    }

    function renderChips(typeCounts, models) {
      const typeBox = document.getElementById("typeChips");
      const modelBox = document.getElementById("modelChips");
      const entries = Object.entries(typeCounts || {});
      typeBox.innerHTML = entries.length
        ? entries.map(([k, v]) => {
            const bad = k === "错误" ? " bad" : "";
            return '<span class="chip' + bad + '">' + esc(k) + ' <b>' + esc(v) + '</b></span>';
          }).join("")
        : "";
      const top = (models || []).slice(0, 6);
      modelBox.innerHTML = top.length
        ? top.map(m => '<span class="chip">' + esc(m.model) + ' <b>' + esc(m.count) + '</b></span>').join("")
        : "";
    }

    let currentLogs = [];

    function renderLogs(logs) {
      currentLogs = logs || [];
      const box = document.getElementById("logs");
      if (!currentLogs.length) {
        box.innerHTML = '<div class="banner empty">窗口内暂无日志</div>';
        return;
      }
      box.innerHTML = currentLogs.map((l, idx) => {
        const badgeCls = TYPE_CLASS[l.type_label] || "t-系统";
        const showCost = l.type === 2 || (l.cost_cny && l.cost_cny > 0);
        const cost = showCost
          ? '<span class="muted">费用</span> <b class="yen">' + esc(money(l.cost_cny)) + '</b>'
          : '<span class="muted">费用</span> —';
        return (
          '<div class="row" data-idx="' + idx + '" role="button" tabindex="0">' +
            '<div class="row-top">' +
              '<span class="time">' + esc(l.time) + '</span>' +
              '<span class="badge ' + badgeCls + '">' + esc(l.type_label) + '</span>' +
            '</div>' +
            '<div class="meta">' +
              '<span><span class="muted">用户</span> <b>' + esc(l.username || "—") + '</b></span>' +
              '<span><span class="muted">模型</span> ' + esc(l.model || "—") + '</span>' +
              '<span><span class="muted">耗时</span> ' + esc(l.duration || 0) + 's</span>' +
              '<span>' + cost + '</span>' +
            '</div>' +
            '<div class="content-line">' + esc(l.content_short || "") + '</div>' +
          '</div>'
        );
      }).join("");

      box.querySelectorAll(".row").forEach(el => {
        el.addEventListener("click", () => selectLog(Number(el.dataset.idx)));
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectLog(Number(el.dataset.idx)); }
        });
      });
    }

    function kv(k, v, cls) {
      return '<div class="k">' + esc(k) + '</div><div class="v' + (cls ? ' ' + cls : '') + '">' + v + '</div>';
    }

    function selectLog(idx) {
      const l = currentLogs[idx];
      if (!l) return;
      document.querySelectorAll(".row").forEach((el, i) => el.classList.toggle("active", i === idx));
      const detail = document.getElementById("detail");
      const otherStr = l.other && Object.keys(l.other).length ? JSON.stringify(l.other, null, 2) : "";
      const statusCls = (l.status_code && Number(l.status_code) >= 400) ? "bad" : "";
      detail.innerHTML =
        '<h3>' + esc(l.type_label) + ' · ' + esc(l.username || "—") + ' · ' + esc(l.time_full || l.time) + '</h3>' +
        '<div class="kv">' +
          kv("Request ID", esc(l.request_id || "—")) +
          kv("状态码", esc(l.status_code ?? "—"), statusCls) +
          kv("模型", esc(l.model || "—")) +
          kv("分组", esc(l.group || "—")) +
          kv("令牌", esc(l.token_name || "—")) +
          kv("渠道", esc(l.channel_name || "—")) +
          kv("耗时", esc(l.duration || 0) + " 秒") +
          kv("费用", esc(money(l.cost_cny)) + "（quota " + esc(l.quota) + " / ≈$" + esc(Number(l.cost_usd||0).toFixed(6)) + "）", "money") +
          kv("Tokens", "prompt " + esc(l.prompt_tokens) + " · completion " + esc(l.completion_tokens)) +
          kv("IP", esc(l.ip || "—")) +
          kv("日志 ID", esc(l.id)) +
        '</div>' +
        '<pre class="full">' + esc(l.content || "(无内容)") + '</pre>' +
        (otherStr ? '<pre class="full">' + esc(otherStr) + '</pre>' : '');
      detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    async function load(refresh) {
      const errBox = document.getElementById("errorBox");
      const loading = document.getElementById("loading");
      const app = document.getElementById("app");
      const btn = document.getElementById("refreshBtn");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "刷新中";
      if (app.classList.contains("hidden")) loading.classList.remove("hidden");
      try {
        const url = "/api/overview" + (refresh ? "?refresh=1" : "");
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "加载失败");
        loading.classList.add("hidden");
        app.classList.remove("hidden");
        document.title = data.title || "追觅客户监控 · Susciyuan";
        document.getElementById("scopePill").textContent = data.filter && data.filter.site_wide ? "全站 · 近3天" : "过滤模式";
        document.getElementById("windowText").textContent =
          (data.window && data.window.start || "") + " ~ " + (data.window && data.window.end || "") +
          " (" + ((data.window && data.window.tz) || "CST") + ")";
        document.getElementById("genText").textContent =
          "更新 " + (data.generated_at || "") + (data.cached ? " · 缓存" : "");
        document.getElementById("logMeta").textContent =
          "展示 " + data.log_returned + "/" + data.log_total_in_window + "（上限 300）";
        renderMetrics(data.metrics || {});
        renderChips(data.type_counts || {}, data.top_models || []);
        renderLogs(data.logs || []);
        const errIdx = (data.logs || []).findIndex(l => l.type === 5);
        if (errIdx >= 0) selectLog(errIdx);
      } catch (e) {
        loading.classList.add("hidden");
        errBox.classList.remove("hidden");
        errBox.textContent = "加载失败：" + (e.message || e);
      } finally {
        btn.disabled = false;
        btn.textContent = "立即刷新";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => load(true));
    setInterval(() => load(true), 600000);
    load(false);
  </script>
</body>
</html>
